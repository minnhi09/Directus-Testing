{
  "name": "P10 isolated regression smoke",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "p10-isolated-lab",
    "cancel-in-progress": false
  },
  "jobs": {
    "preflight": {
      "name": "M2 regression + captured HTTP contract diagnostic",
      "runs-on": [
        "self-hosted",
        "Windows",
        "X64",
        "damh-p09"
      ],
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false,
            "clean": false
          }
        },
        {
          "name": "Regression once, contract diagnostic and safe reports; preserve FAIL",
          "shell": "pwsh",
          "run": "python -B scripts/ci_m2.py --remote --key ci-${{ github.run_id }}-${{ github.run_attempt }}"
        },
        {
          "name": "Read-only finalizer; interrupted cleanup stays UNVERIFIED",
          "if": "always()",
          "shell": "pwsh",
          "run": "python -B scripts/ci_m2.py --remote --finalize --key ci-${{ github.run_id }}-${{ github.run_attempt }}"
        },
        {
          "name": "Upload scanned evidence including FAIL and cleanup",
          "if": "always()",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "m2-ci-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "artifacts/runs/m2-ci/ci-${{ github.run_id }}-${{ github.run_attempt }}/public/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ],
      "if": "github.repository == 'minnhi09/Directus-Testing' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'"
    }
  }
}
